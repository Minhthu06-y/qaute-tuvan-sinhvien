spring.datasource.url=${DB_TEST_URL:jdbc:sqlserver://localhost:1433;databaseName=QAUTE_TEST;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_TEST_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${DB_TEST_PASSWORD:${DB_PASSWORD:sa@123456}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.sql.init.mode=never
