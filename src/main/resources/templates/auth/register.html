<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">
            <h2 class="text-center mb-4">Đăng ký QAUTE</h2>

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <form th:action="@{/register}"
                  th:object="${registerRequest}" method="post">

                <div class="mb-3">
                    <label class="form-label">Họ và tên</label>
                    <input class="form-control" th:field="*{fullName}">
                    <small class="text-danger"
                           th:errors="*{fullName}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control"
                           th:field="*{email}">
                    <small class="text-danger"
                           th:errors="*{email}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input class="form-control" th:field="*{phone}">
                    <small class="text-danger"
                           th:errors="*{phone}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control"
                           th:field="*{password}" autocomplete="new-password">
                    <small class="text-danger"
                           th:errors="*{password}"></small>
                    <div class="form-text">
                        Tối thiểu 8 ký tự, có chữ hoa, chữ thường,
                        số và ký hiệu đặc biệt.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" class="form-control"
                           th:field="*{confirmPassword}"
                           autocomplete="new-password">
                    <small class="text-danger"
                           th:errors="*{confirmPassword}"></small>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input"
                           th:field="*{student}" id="student">
                    <label class="form-check-label" for="student">
                        Tôi là sinh viên/cựu sinh viên QAUTE
                    </label>
                </div>

                <div id="studentFields" class="border rounded p-3 mb-3"
                     hidden>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input"
                               th:field="*{currentlyStudying}"
                               id="currentlyStudying">
                        <label class="form-check-label"
                               for="currentlyStudying">
                            Tôi hiện đang học tại trường
                        </label>
                    </div>

                    <div id="studentIdGroup" class="mb-3">
                        <label class="form-label">Mã số sinh viên</label>
                        <input class="form-control"
                               th:field="*{studentId}">
                        <small class="text-danger"
                               th:errors="*{studentId}"></small>
                    </div>

                    <div id="graduationGroup" class="mb-3" hidden>
                        <label class="form-label">Ngày cấp bằng</label>
                        <input type="date" class="form-control"
                               th:field="*{graduationDate}">
                        <small class="text-danger"
                               th:errors="*{graduationDate}"></small>
                    </div>

                    <div class="alert alert-info mb-0">
                        Vui lòng sử dụng email do trường cấp.
                    </div>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Đăng ký và nhận OTP
                </button>

                <p class="text-center mt-3 mb-0">
                    Đã có tài khoản?
                    <a th:href="@{/login}">Đăng nhập</a>
                </p>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/register.js}"></script>
</body>
</html>
