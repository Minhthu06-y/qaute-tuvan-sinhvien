<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm border-0 form-card">
        <div class="card-body p-4 p-md-5">
            <h2 class="fw-bold mb-2">Đăng ký tài khoản</h2>
            <p class="text-secondary">Tạo tài khoản QAUTE để đặt câu hỏi.</p>

            <div class="alert alert-danger"
                 th:if="${#fields.hasGlobalErrors()}">
                <p class="mb-0"
                   th:each="err : ${#fields.globalErrors()}"
                   th:text="${err}"></p>
            </div>

            <form th:action="@{/register}"
                  th:object="${registerRequest}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label required">Họ và tên</label>
                    <input class="form-control" th:field="*{fullName}" required>
                    <div class="text-danger small"
                         th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label required">Email</label>
                    <input type="email" class="form-control"
                           th:field="*{email}" required>
                    <div class="text-danger small"
                         th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label required">Số điện thoại</label>
                    <input class="form-control" th:field="*{phone}"
                           placeholder="0912345678" required>
                    <div class="text-danger small"
                         th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label required">Ngày sinh</label>
                    <input type="date" class="form-control"
                           th:field="*{dateOfBirth}" required>
                    <div class="text-danger small"
                         th:errors="*{dateOfBirth}"></div>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox"
                           th:field="*{universityStudent}"
                           id="universityStudent">
                    <label class="form-check-label" for="universityStudent">
                        Tôi là sinh viên hoặc cựu sinh viên trường
                    </label>
                </div>

                <div id="studentFields" class="border rounded p-3 mb-3 d-none">
                    <div class="mb-3">
                        <label class="form-label required">Mã số sinh viên</label>
                        <input class="form-control" th:field="*{studentCode}"
                               id="studentCode">
                    </div>

                    <div class="mb-3">
                        <label class="form-label required">Tình trạng học tập</label>
                        <select class="form-select"
                                th:field="*{currentlyStudying}"
                                id="currentlyStudying">
                            <option value="">-- Chọn --</option>
                            <option value="true">Đang học</option>
                            <option value="false">Đã tốt nghiệp</option>
                        </select>
                    </div>

                    <div id="graduationField" class="d-none">
                        <label class="form-label required">Ngày cấp bằng</label>
                        <input type="date" class="form-control"
                               th:field="*{graduationDate}"
                               id="graduationDate">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label required">Mật khẩu</label>
                    <input type="password" class="form-control"
                           th:field="*{password}" required
                           autocomplete="new-password">
                    <div class="form-text">
                        Tối thiểu 8 ký tự, có chữ hoa, chữ thường, số
                        và ký hiệu đặc biệt.
                    </div>
                    <div class="text-danger small"
                         th:errors="*{password}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label required">Xác nhận mật khẩu</label>
                    <input type="password" class="form-control"
                           th:field="*{confirmPassword}" required
                           autocomplete="new-password">
                    <div class="text-danger small"
                         th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Đăng ký và nhận OTP
                </button>

                <p class="text-center mt-3 mb-0">
                    Đã có tài khoản?
                    <a th:href="@{/login}">Đăng nhập</a>
                </p>
            </form>
        </div>
    </div>
</div>

<script>
    const studentCheckbox = document.getElementById('universityStudent');
    const studentFields = document.getElementById('studentFields');
    const studying = document.getElementById('currentlyStudying');
    const graduationField = document.getElementById('graduationField');
    const studentCode = document.getElementById('studentCode');
    const graduationDate = document.getElementById('graduationDate');

    function updateStudentFields() {
        const isStudent = studentCheckbox.checked;

        studentFields.classList.toggle('d-none', !isStudent);
        studentCode.required = isStudent;
        studying.required = isStudent;

        const graduated = isStudent && studying.value === 'false';
        graduationField.classList.toggle('d-none', !graduated);
        graduationDate.required = graduated;
    }

    studentCheckbox.addEventListener('change', updateStudentFields);
    studying.addEventListener('change', updateStudentFields);
    updateStudentFields();
</script>
</body>
</html>
