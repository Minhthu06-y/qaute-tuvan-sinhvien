<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác minh OTP - QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 450px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-3">Xác minh email</h3>
            <p>Nhập mã OTP đã gửi tới email của bạn.</p>

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <form th:action="@{/verify-otp}" method="post">
                <input type="hidden" name="email" th:value="${email}">

                <div class="mb-3">
                    <label class="form-label">Mã OTP</label>
                    <input name="code" class="form-control"
                           inputmode="numeric" pattern="[0-9]{6}"
                           maxlength="6" required>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Xác minh
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
