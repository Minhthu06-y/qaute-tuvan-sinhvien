<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width:460px">
        <div class="card-body p-4">
            <h2 class="fw-bold mb-3">Đăng nhập QAUTE</h2>

            <div class="alert alert-danger" th:if="${param.error}">
                Đăng nhập thất bại. Hãy kiểm tra email, mật khẩu,
                trạng thái xác minh và trạng thái tài khoản.
            </div>

            <div class="alert alert-success" th:if="${success}"
                 th:text="${success}"></div>

            <div class="alert alert-danger" th:if="${param.logout}">
                Bạn đã đăng xuất.
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control"
                           autocomplete="username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password"
                           class="form-control"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Đăng nhập
                </button>
            </form>

            <p class="text-center mt-3 mb-0">
                Chưa có tài khoản?
                <a th:href="@{/register}">Đăng ký ngay</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
