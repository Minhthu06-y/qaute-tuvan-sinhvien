<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 450px;">
        <div class="card-body p-4">
            <h2 class="text-center mb-4">Đăng nhập QAUTE</h2>

            <div th:if="${param.error}" class="alert alert-danger">
                Email, mật khẩu không chính xác hoặc tài khoản chưa được
                xác minh/kích hoạt.
            </div>

            <div th:if="${param.verified}" class="alert alert-success">
                Xác minh thành công. Bạn có thể đăng nhập.
            </div>

            <div th:if="${param.logout}" class="alert alert-info">
                Bạn đã đăng xuất.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="username"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password"
                           class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Đăng nhập
                </button>
            </form>

            <p class="text-center mt-3">
                Chưa có tài khoản?
                <a th:href="@{/register}">Đăng ký</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
