<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Câu hỏi của tôi - QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Câu hỏi của tôi</h2>
        <a th:href="@{/questions/new}" class="btn btn-primary">
            Đặt câu hỏi mới
        </a>
    </div>

    <div th:if="${param.created}" class="alert alert-success">
        Câu hỏi đã được gửi thành công.
    </div>

    <div th:if="${#lists.isEmpty(questions)}"
         class="alert alert-info">
        Bạn chưa đặt câu hỏi nào.
    </div>

    <div th:each="question : ${questions}"
         class="card mb-3">
        <div class="card-body">
            <h5 th:text="${question.title}"></h5>
            <p th:text="${question.content}"></p>

            <p class="small text-muted">
                <span th:text="${question.category}"></span>
                ·
                <span th:text="${#temporals.format(
                    question.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            </p>

            <span class="badge bg-secondary"
                  th:text="${question.status}"></span>

            <span th:if="${question.publicQuestion}"
                  class="badge bg-success">Công khai</span>

            <span th:unless="${question.publicQuestion}"
                  class="badge bg-warning text-dark">
                Chưa công khai
            </span>
        </div>
    </div>

    <a th:href="@{/forum}" class="btn btn-outline-secondary">
        Về diễn đàn
    </a>
</div>
</body>
</html>
