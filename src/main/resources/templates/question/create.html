<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt câu hỏi - QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 800px;">
        <div class="card-body p-4">
            <h2 class="mb-4">Đặt câu hỏi</h2>

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <form th:action="@{/questions/create}"
                  th:object="${questionRequest}" method="post">

                <div class="mb-3">
                    <label class="form-label">Tiêu đề</label>
                    <input class="form-control" th:field="*{title}">
                    <small class="text-danger"
                           th:errors="*{title}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lĩnh vực</label>
                    <select class="form-select" th:field="*{category}">
                        <option value="">-- Chọn lĩnh vực --</option>
                        <option value="DaoTao">Đào tạo</option>
                        <option value="HocPhi">Học phí</option>
                        <option value="CongTacSinhVien">
                            Công tác sinh viên
                        </option>
                        <option value="Khac">Khác</option>
                    </select>
                    <small class="text-danger"
                           th:errors="*{category}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nội dung</label>
                    <textarea class="form-control" rows="7"
                              th:field="*{content}"></textarea>
                    <small class="text-danger"
                           th:errors="*{content}"></small>
                </div>

                <div class="alert alert-info">
                    Câu hỏi sẽ được lưu ở trạng thái chưa trả lời và
                    chưa công khai. Việc công khai cần theo quy trình
                    duyệt của hệ thống.
                </div>

                <button class="btn btn-primary" type="submit">
                    Gửi câu hỏi
                </button>
                <a th:href="@{/forum}" class="btn btn-secondary">
                    Quay lại
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
