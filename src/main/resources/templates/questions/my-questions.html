<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Câu hỏi của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Câu hỏi của tôi</h2>
        <a class="btn btn-primary" th:href="@{/questions/create}">
            + Đặt câu hỏi
        </a>
    </div>

    <div th:if="${param.created}" class="alert alert-success">
        Đã gửi câu hỏi thành công.
    </div>

    <div th:if="${#lists.isEmpty(questions)}" class="alert alert-info">
        Bạn chưa đặt câu hỏi nào.
    </div>

    <div th:each="q : ${questions}"
         class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between gap-3">
                <h5 th:text="${q.title}"></h5>
                <span class="badge"
                      th:classappend="${q.isPublic} ?
                        'text-bg-success' : 'text-bg-secondary'"
                      th:text="${q.isPublic} ?
                        'Đã công khai' : 'Chờ xử lý'"></span>
            </div>
            <p class="text-secondary small">
                <span th:text="${#temporals.format(
                    q.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            </p>
            <p th:text="${q.content}"></p>
        </div>
    </div>
</div>
</body>
</html>
