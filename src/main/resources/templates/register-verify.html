<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Xác minh email')}"></head>

<body class="auth-page">

    <style>
        /* Khung chứa 6 ô OTP */
        .otp-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        /* Từng ô OTP */
        .otp-input {
            width: 42px;
            height: 55px;
            border: none;
            border-bottom: 2px solid #ced4da;
            border-radius: 0;
            background: transparent;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #0d6efd;
            outline: none;
            padding: 0;
            box-shadow: none;
            transition: border-color 0.2s ease;
        }

        /* Khi chọn ô nhập OTP */
        .otp-input:focus {
            border-bottom: 2px solid #0d6efd;
            box-shadow: none;
        }

        /* Khi ô đã có số */
        .otp-input.filled {
            border-bottom-color: #0d6efd;
        }

        /* Thông báo lỗi */
        .otp-error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        /* Hiển thị tốt trên điện thoại */
        @media (max-width: 380px) {
            .otp-container {
                gap: 8px;
            }

            .otp-input {
                width: 36px;
                height: 48px;
                font-size: 21px;
            }
        }
    </style>

    <div class="auth-card">

        <div class="auth-card-head">

            <div class="auth-logo">
                <i class="bi bi-envelope-check-fill"></i>
            </div>

            <h1>XÁC MINH EMAIL</h1>

            <p>QAUTE • NHÓM 4</p>

        </div>

        <div class="auth-card-body">

            <div th:replace="~{fragments :: alerts}"></div>

            <h2 style="font-size:17px; font-weight:800; margin-bottom:5px">
                Nhập mã OTP
            </h2>

            <p class="text-muted" style="font-size:11px; margin-bottom:18px">
                Mã xác minh đã được gửi đến
                <strong th:text="${email}">email của bạn</strong>
                và có hiệu lực trong 5 phút.
            </p>

            <form th:action="@{/register/verify}"
                  method="post"
                  id="otpForm">

                <div class="mb-3">

                    <label class="form-label d-block text-center"
                           for="otp-0">
                        Mã OTP gồm 6 chữ số
                    </label>

                    <!-- Sáu ô nhập OTP -->
                    <div class="otp-container">

                        <input type="text"
                               class="otp-input"
                               id="otp-0"
                               inputmode="numeric"
                               autocomplete="one-time-code"
                               maxlength="6"
                               aria-label="Chữ số OTP thứ nhất"
                               required
                               autofocus>

                        <input type="text"
                               class="otp-input"
                               id="otp-1"
                               inputmode="numeric"
                               maxlength="1"
                               aria-label="Chữ số OTP thứ hai">

                        <input type="text"
                               class="otp-input"
                               id="otp-2"
                               inputmode="numeric"
                               maxlength="1"
                               aria-label="Chữ số OTP thứ ba">

                        <input type="text"
                               class="otp-input"
                               id="otp-3"
                               inputmode="numeric"
                               maxlength="1"
                               aria-label="Chữ số OTP thứ tư">

                        <input type="text"
                               class="otp-input"
                               id="otp-4"
                               inputmode="numeric"
                               maxlength="1"
                               aria-label="Chữ số OTP thứ năm">

                        <input type="text"
                               class="otp-input"
                               id="otp-5"
                               inputmode="numeric"
                               maxlength="1"
                               aria-label="Chữ số OTP thứ sáu">

                    </div>

                    <!-- Giá trị OTP hoàn chỉnh gửi về Spring Boot -->
                    <input type="hidden" id="code" name="code">

                    <div id="otpError" class="otp-error">
                        Vui lòng nhập đầy đủ 6 chữ số OTP.
                    </div>

                </div>

                <button class="btn btn-primary w-100 mt-2"
                        type="submit">

                    <i class="bi bi-shield-check me-2"></i>
                    Xác minh và tạo tài khoản

                </button>

            </form>

            <form th:action="@{/register/resend-otp}"
                  method="post"
                  class="mt-3 text-center">

                <button class="btn btn-link btn-sm" type="submit">
                    Gửi lại mã OTP
                </button>

            </form>

            <div class="auth-footer">
                <a th:href="@{/register}">
                    Quay lại đăng ký
                </a>
            </div>

        </div>

    </div>

    <script>
        const otpInputs = document.querySelectorAll('.otp-input');
        const otpCode = document.getElementById('code');
        const otpForm = document.getElementById('otpForm');
        const otpError = document.getElementById('otpError');

        // Cập nhật mã OTP vào trường code gửi về backend
        function updateOtpCode() {
            otpCode.value = Array.from(otpInputs)
                .map(input => input.value)
                .join('');

            otpInputs.forEach(input => {
                input.classList.toggle('filled', input.value !== '');
            });

            otpError.style.display = 'none';
        }

        // Nhập số, tự động chuyển ô tiếp theo
        otpInputs.forEach((input, index) => {

            input.addEventListener('input', function () {

                // Chỉ giữ lại chữ số
                let value = this.value.replace(/[^0-9]/g, '');

                // Hỗ trợ dán cả mã OTP 6 số vào ô đầu tiên
                if (value.length > 1) {
                    const digits = value.slice(0, 6).split('');

                    digits.forEach((digit, i) => {
                        if (otpInputs[i]) {
                            otpInputs[i].value = digit;
                        }
                    });

                    // Xóa các ô còn lại nếu cần
                    for (let i = digits.length; i < 6; i++) {
                        otpInputs[i].value = '';
                    }

                    const nextIndex = Math.min(digits.length, 5);

                    otpInputs[nextIndex].focus();
                } else {
                    this.value = value;

                    if (value !== '' && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                }

                updateOtpCode();
            });

            // Nhấn Backspace để quay lại ô trước
            input.addEventListener('keydown', function (event) {

                if (event.key === 'Backspace' && this.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }

                // Điều hướng giữa các ô bằng phím mũi tên
                if (event.key === 'ArrowLeft' && index > 0) {
                    otpInputs[index - 1].focus();
                }

                if (event.key === 'ArrowRight' && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            // Hỗ trợ dán mã OTP
            input.addEventListener('paste', function (event) {
                event.preventDefault();

                const pastedText = (
                    event.clipboardData || window.clipboardData
                ).getData('text');

                const digits = pastedText
                    .replace(/[^0-9]/g, '')
                    .slice(0, 6)
                    .split('');

                otpInputs.forEach((otpInput, i) => {
                    otpInput.value = digits[i] || '';
                });

                const focusIndex = Math.min(digits.length, 5);
                otpInputs[focusIndex].focus();

                updateOtpCode();
            });

        });

        // Chỉ cho phép gửi biểu mẫu khi đã nhập đủ 6 số
        otpForm.addEventListener('submit', function (event) {

            updateOtpCode();

            if (!/^[0-9]{6}$/.test(otpCode.value)) {
                event.preventDefault();

                otpError.style.display = 'block';

                const firstEmpty = Array.from(otpInputs)
                    .find(input => input.value === '');

                if (firstEmpty) {
                    firstEmpty.focus();
                }

                return;
            }

        });
    </script>

</body>

</html>
