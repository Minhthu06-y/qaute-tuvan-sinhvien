<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Xác minh email')}"></head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-card-head">
      <div class="auth-logo"><i class="bi bi-envelope-check-fill"></i></div>
      <h1>XÁC MINH EMAIL</h1>
      <p>QAUTE • NHÓM 4</p>
    </div>
    <div class="auth-card-body">
      <div th:replace="~{fragments :: alerts}"></div>
      <h2 style="font-size:17px;font-weight:800;margin-bottom:5px">Nhập mã OTP</h2>
      <p class="text-muted" style="font-size:11px;margin-bottom:18px">
        Mã xác minh đã được gửi đến <strong th:text="${email}">email của bạn</strong> và có hiệu lực trong 5 phút.
      </p>
      <form th:action="@{/register/verify}" method="post">
        <div class="mb-3">
          <label class="form-label" for="code">Mã OTP gồm 6 chữ số</label>
          <input class="form-control" id="code" name="code" type="text" inputmode="numeric"
                 autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required autofocus>
        </div>
        <button class="btn btn-primary w-100 mt-2" type="submit">
          <i class="bi bi-shield-check me-2"></i>Xác minh và tạo tài khoản
        </button>
      </form>
      <form th:action="@{/register/resend-otp}" method="post" class="mt-3 text-center">
        <button class="btn btn-link btn-sm" type="submit">Gửi lại mã OTP</button>
      </form>
      <div class="auth-footer"><a th:href="@{/register}">Quay lại đăng ký</a></div>
    </div>
  </div>
</body>
</html>
