<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đặt lại mật khẩu')}"></head>
<body class="auth-page">
  <main class="auth-card">
    <header class="auth-card-head">
      <div class="auth-logo"><i class="bi bi-shield-lock-fill"></i></div>
      <h1>QAUTE • TƯ VẤN SINH VIÊN</h1>
      <p>ĐẶT LẠI MẬT KHẨU</p>
    </header>
    <section class="auth-card-body">
      <div th:replace="~{fragments :: alerts}"></div>
      <h2 style="font-size:17px;font-weight:800;margin-bottom:5px">Tạo mật khẩu mới</h2>
      <p class="text-muted" style="font-size:12px;margin-bottom:18px">
        Mã xác minh đã được gửi nếu email này thuộc tài khoản đang hoạt động:
        <strong th:text="${email}">email@example.com</strong>
      </p>
      <form th:action="@{/reset-password}" method="post">
        <div class="mb-3">
          <label class="form-label" for="code">Mã OTP gồm 6 chữ số</label>
          <input class="form-control" type="text" id="code" name="code" inputmode="numeric"
                 autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="newPassword">Mật khẩu mới</label>
          <input class="form-control" type="password" id="newPassword" name="newPassword"
                 autocomplete="new-password" minlength="8" maxlength="72" required>
          <div class="form-hint mt-1">Tối thiểu 8 ký tự.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
          <input class="form-control" type="password" id="confirmPassword" name="confirmPassword"
                 autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>
        <button class="btn btn-primary w-100 mt-2" type="submit">
          <i class="bi bi-check2-circle me-2"></i>Cập nhật mật khẩu
        </button>
      </form>
      <form th:action="@{/reset-password/resend-otp}" method="post" class="text-center mt-2">
        <button class="btn btn-link btn-sm" type="submit">Gửi lại mã OTP</button>
      </form>
      <div class="auth-footer"><a th:href="@{/forgot-password}">Dùng email khác</a></div>
    </section>
  </main>
</body>
</html>
