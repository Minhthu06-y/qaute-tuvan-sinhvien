<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Thông tin tư vấn viên')}"></head>
<body class="admin-body"><div class="admin-shell"><aside th:replace="~{admin/layout :: sidebar('advisors')}"></aside><div class="admin-main"><header th:replace="~{admin/layout :: topbar}"></header>
<main class="admin-content"><div th:replace="~{admin/layout :: alerts}"></div>
  <div class="admin-page-heading"><div><div class="admin-kicker">Tài khoản & đội ngũ</div><h1 th:text="${editId == null ? 'Thêm tư vấn viên' : 'Cập nhật tư vấn viên'}">Thông tin tư vấn viên</h1><p>Email phải thuộc tài khoản người dùng đã đăng ký trên hệ thống.</p></div><a class="btn btn-light btn-sm" th:href="@{/admin/advisors}"><i class="bi bi-arrow-left me-1"></i>Danh sách</a></div>
  <section class="admin-card admin-form"><div class="admin-card-head"><div><h2>Thông tin hồ sơ</h2><p>Chọn khoa và đối tượng mà tư vấn viên phụ trách.</p></div></div><div class="admin-card-body">
    <form th:action="${editId == null ? '/admin/advisors' : '/admin/advisors/' + editId}" method="post" th:object="${form}">
      <div class="admin-form-grid">
        <div><label class="form-label" for="fullName">Họ và tên</label><input id="fullName" name="fullName" class="form-control" th:value="${form.fullName}" required><div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div></div>
        <div><label class="form-label" for="email">Email tài khoản</label><input id="email" name="email" type="email" class="form-control" th:value="${form.email}" th:readonly="${editId != null}" required><div class="form-text">Khi thêm mới, email phải có tài khoản QAUTE.</div><div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div>
        <div><label class="form-label" for="phone">Số điện thoại</label><input id="phone" name="phone" class="form-control" th:value="${form.phone}" placeholder="0912345678" required><div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div></div>
        <div><label class="form-label" for="advisorType">Đối tượng</label><select id="advisorType" name="advisorType" class="form-select" required><option value="">Chọn đối tượng</option><option th:each="type : ${advisorTypes}" th:value="${type}" th:selected="${form.advisorType == type}" th:text="${type.label}">Sinh viên</option></select><div class="text-danger small" th:if="${#fields.hasErrors('advisorType')}" th:errors="*{advisorType}"></div></div><div><label class="form-label" for="departmentId">Khoa / đơn vị</label><select id="departmentId" name="departmentId" class="form-select" required><option value="">Chọn đơn vị</option><option th:each="department : ${departments}" th:value="${department.id}" th:selected="${form.departmentId != null && form.departmentId == department.id}" th:text="${department.name}">Khoa</option></select><div class="text-danger small" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div></div>
        <div><label class="form-label" for="audience">Nhóm được tư vấn</label><select id="audience" name="audience" class="form-select" required><option value="">Chọn nhóm được tư vấn</option><option th:each="audience : ${audiences}" th:value="${audience}" th:selected="${form.audience == audience}" th:text="${audience}">SINH_VIEN</option></select><div class="text-danger small" th:if="${#fields.hasErrors('audience')}" th:errors="*{audience}"></div></div>
        <div><label class="form-label" for="status">Trạng thái</label><select id="status" name="status" class="form-select" required><option th:each="s : ${statuses}" th:value="${s}" th:selected="${form.status == s}" th:text="${s.name() == 'ACTIVE' ? 'Đang hoạt động' : 'Tạm ngưng'}">Đang hoạt động</option></select><div class="text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div></div>
        <label class="admin-check-option admin-field-full"><input type="checkbox" name="head" value="true" th:checked="${form.head}"><span>Chỉ định làm trưởng chuyên viên tư vấn của khoa</span></label>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4"><a th:href="@{/admin/advisors}" class="btn btn-light btn-sm">Hủy</a><button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-check2 me-1"></i>Lưu thông tin</button></div>
    </form>
  </div></section>
</main></div></div></body></html>
