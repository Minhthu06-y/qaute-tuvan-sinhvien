<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Chi tiết câu hỏi')}"></head>
<body class="admin-body">
<div class="admin-shell">
  <aside th:replace="~{admin/layout :: sidebar('questions')}"></aside>
  <div class="admin-main">
    <header th:replace="~{admin/layout :: topbar}"></header>
    <main class="admin-content">
      <div class="admin-page-heading">
        <div><div class="admin-kicker">Hỗ trợ sinh viên</div><h1>Chi tiết câu hỏi</h1><p>Xem nội dung và toàn bộ phản hồi trong cuộc trao đổi.</p></div>
        <a class="btn btn-light btn-sm" th:href="@{/admin/student-questions}"><i class="bi bi-arrow-left me-1"></i>Danh sách câu hỏi</a>
      </div>
      <section class="admin-card">
        <div class="admin-card-head"><div><h2 th:text="${question.subject}">Tiêu đề câu hỏi</h2><p><span th:text="${question.faculty != null ? question.faculty.name : 'Chưa phân khoa'}">Khoa</span><span th:if="${question.topic != null}" th:text="${' · ' + question.topic.name}"></span></p></div><span class="admin-status" th:classappend="${question.status.name() == 'OPEN' || question.status.name() == 'UNANSWERED' ? 'pending' : ''}" th:text="${question.status.name() == 'OPEN' || question.status.name() == 'UNANSWERED' ? 'Chưa trả lời' : 'Đã trả lời'}">Trạng thái</span></div>
        <div class="admin-card-body">
          <div class="d-flex justify-content-between flex-wrap gap-2 mb-3"><span class="admin-primary-text" th:text="${question.asker.displayName} + ' · ' + ${question.asker.email}">Sinh viên</span><span class="admin-secondary-text" th:text="${question.createdAt != null ? #temporals.format(question.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">18/10/2026</span></div>
          <div class="admin-question-content" th:text="${question.body}">Nội dung câu hỏi</div>
          <a class="btn btn-light btn-sm mt-3" th:if="${question.attachmentUrl != null and !question.attachmentUrl.isBlank()}" th:href="${question.attachmentUrl}" target="_blank" rel="noopener"><i class="bi bi-paperclip me-1"></i>Mở tệp đính kèm</a>
        </div>
      </section>
      <section class="admin-card">
        <div class="admin-card-head"><div><h2>Phản hồi</h2><p th:text="${answers.size()} + ' câu trả lời'">0 câu trả lời</p></div></div>
        <div class="admin-card-body">
          <article class="admin-answer-card" th:each="answer : ${answers}">
            <div class="d-flex justify-content-between flex-wrap gap-2"><strong class="admin-primary-text" th:text="${answer.author.displayName}">Tư vấn viên</strong><span class="admin-secondary-text" th:text="${answer.createdAt != null ? #temporals.format(answer.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">18/10/2026</span></div>
            <p th:text="${answer.body}">Nội dung trả lời</p>
          </article>
          <div th:if="${#lists.isEmpty(answers)}" class="admin-empty"><i class="bi bi-chat-dots"></i>Câu hỏi chưa có phản hồi.</div>
        </div>
      </section>
    </main>
  </div>
</div>
</body>
</html>
