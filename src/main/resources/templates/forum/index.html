<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diễn đàn QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/forum}">QAUTE</a>

        <div class="d-flex gap-2">
            <a sec:authorize="isAnonymous()" th:href="@{/login}"
               class="btn btn-light">Đăng nhập</a>

            <a sec:authorize="isAnonymous()" th:href="@{/register}"
               class="btn btn-outline-light">Đăng ký</a>

            <a sec:authorize="isAuthenticated()"
               th:href="@{/questions/new}"
               class="btn btn-light">Đặt câu hỏi</a>

            <a sec:authorize="isAuthenticated()"
               th:href="@{/questions/my}"
               class="btn btn-outline-light">Câu hỏi của tôi</a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}" method="post">
                <button class="btn btn-danger" type="submit">
                    Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h2 class="mb-4">Diễn đàn tư vấn sinh viên</h2>

    <div sec:authorize="isAnonymous()" class="alert alert-info">
        Bạn đang xem với tư cách khách. Đăng nhập để đặt câu hỏi và
        tương tác với diễn đàn.
    </div>

    <div th:if="${#lists.isEmpty(questions)}"
         class="alert alert-secondary">
        Chưa có câu hỏi công khai.
    </div>

    <div th:each="question : ${questions}"
         class="card mb-3 shadow-sm">
        <div class="card-body">
            <h5 class="card-title" th:text="${question.title}"></h5>

            <p class="text-muted small">
                Lĩnh vực:
                <span th:text="${question.category}"></span>
                · Người hỏi:
                <span th:text="${question.author.fullName}"></span>
                ·
                <span th:text="${#temporals.format(
                    question.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            </p>

            <p class="card-text"
               th:text="${question.content}"></p>

            <span class="badge bg-secondary"
                  th:text="${question.status}"></span>
        </div>
    </div>
</main>
</body>
</html>
