<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đăng ký')}"></head>
<body class="auth-page"><div class="auth-card"><div class="auth-card-head"><div class="auth-logo"><i class="bi bi-person-plus-fill"></i></div><h1>TẠO TÀI KHOẢN SINH VIÊN</h1><p>QAUTE • NHÓM 4</p></div><div class="auth-card-body">
  <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div><h2 style="font-size:17px;font-weight:800;margin-bottom:5px">Đăng ký</h2><p class="text-muted" style="font-size:11px;margin-bottom:18px">Tài khoản sinh viên cần xác minh email trước khi đăng nhập.</p>
  <form th:action="@{/register}" method="post"><div class="mb-3"><label class="form-label">Họ và tên</label><input class="form-control" name="displayName" required maxlength="120" placeholder="Nguyễn Văn A"></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required placeholder="email@sinhvien.edu.vn"></div><div class="mb-3"><label class="form-label">Khoa / đơn vị quan tâm</label><select class="form-select" name="facultyId"><option value="">Chọn khoa</option><option th:each="faculty : ${faculties}" th:value="${faculty.id}" th:text="${faculty.name}">Khoa CNTT</option></select></div><div class="mb-3"><label class="form-label">Mật khẩu <span class="text-muted fw-normal">(ít nhất 6 ký tự)</span></label><input class="form-control" name="password" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn btn-primary w-100 mt-2" type="submit"><i class="bi bi-envelope-check me-2"></i>Gửi mã OTP</button></form>
  <div class="auth-footer">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></div>
</div></div></body></html>
