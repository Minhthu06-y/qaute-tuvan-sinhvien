<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quên mật khẩu')}"></head>
<body class="auth-page">
  <main class="auth-card">
    <header class="auth-card-head">
      <div class="auth-logo"><i class="bi bi-key-fill"></i></div>
      <h1>QAUTE • TƯ VẤN SINH VIÊN</h1>
      <p>ĐẶT LẠI MẬT KHẨU</p>
    </header>
    <section class="auth-card-body">
      <div th:replace="~{fragments :: alerts}"></div>
      <h2 style="font-size:17px;font-weight:800;margin-bottom:5px">Quên mật khẩu?</h2>
      <p class="text-muted" style="font-size:12px;margin-bottom:18px">
        Nhập email tài khoản. Nếu tài khoản đang hoạt động, QAUTE sẽ gửi mã xác minh đến email đó.
      </p>
      <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
          <label class="form-label" for="email">Email tài khoản</label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="email"
                 required maxlength="150" placeholder="ten@qaute.edu.vn">
        </div>
        <button class="btn btn-primary w-100 mt-2" type="submit">
          <i class="bi bi-envelope me-2"></i>Gửi mã đặt lại mật khẩu
        </button>
      </form>
      <div class="auth-footer"><a th:href="@{/login}">Quay lại đăng nhập</a></div>
    </section>
  </main>
</body>
</html>
