<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đăng nhập')}"></head>
<body class="auth-page"><div class="auth-card"><div class="auth-card-head"><div class="auth-logo"><i class="bi bi-mortarboard-fill"></i></div><h1>QAUTE • TƯ VẤN SINH VIÊN</h1><p>TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM</p></div><div class="auth-card-body">
  <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div><div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>
  <h2 style="font-size:17px;font-weight:800;margin-bottom:5px">Đăng nhập</h2><p class="text-muted" style="font-size:11px;margin-bottom:18px">Dùng tài khoản sinh viên, đội ngũ tư vấn hoặc quản trị viên.</p>
  <form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" name="email" autocomplete="username" required placeholder="ten@qaute.edu.vn"></div><div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required placeholder="Nhập mật khẩu"></div><button class="btn btn-primary w-100 mt-2" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập</button></form>
  <div class="auth-footer"><a th:href="@{/forgot-password}">Quên mật khẩu?</a><br>Chưa có tài khoản? <a th:href="@{/register}">Đăng ký sinh viên</a> <span class="mx-2">•</span> <a th:href="@{/}">Xem câu hỏi công khai</a></div>
</div></div></body></html>
