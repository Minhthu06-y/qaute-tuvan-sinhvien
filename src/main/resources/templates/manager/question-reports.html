<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Báo cáo câu hỏi')}"></head>
<body class="admin-body"><div class="admin-shell"><aside th:replace="~{admin/layout :: sidebar('question-reports')}"></aside><div class="admin-main"><header th:replace="~{admin/layout :: topbar}"></header>
<main class="admin-content"><div th:replace="~{admin/layout :: alerts}"></div>
  <div class="admin-page-heading"><div><div class="admin-kicker">Kiểm duyệt nội dung</div><h1>Báo cáo câu hỏi</h1><p>Xem xét các báo cáo do tư vấn viên gửi trong khoa / đơn vị bạn phụ trách.</p></div></div>
  <section class="admin-card"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Câu hỏi</th><th>Người báo cáo</th><th>Lý do</th><th>Thời gian</th><th>Xử lý</th></tr></thead><tbody>
    <tr th:each="report : ${reports}"><td><a class="admin-primary-text" th:href="@{/manager/questions/{id}(id=${report.question.id})}" th:text="${report.question.displaySubject}">Câu hỏi</a><small class="admin-secondary-text d-block" th:text="${report.question.department.name}">Khoa</small></td><td th:text="${report.reporter.fullName}">Tư vấn viên</td><td class="text-wrap" th:text="${report.reason}">Lý do</td><td th:text="${#temporals.format(report.createdAt,'dd/MM/yyyy HH:mm')}">Ngày</td><td><div class="d-flex flex-column gap-2"><form th:action="@{/manager/question-reports/{id}/delete(id=${report.id})}" method="post" onsubmit="return confirm('Gỡ câu hỏi này khỏi hệ thống?')"><input name="note" class="form-control form-control-sm mb-1" placeholder="Ghi chú tùy chọn"><button class="btn btn-outline-danger btn-sm" type="submit">Gỡ câu hỏi</button></form><form th:action="@{/manager/question-reports/{id}/dismiss(id=${report.id})}" method="post"><input name="note" class="form-control form-control-sm mb-1" placeholder="Ghi chú tùy chọn"><button class="btn btn-outline-secondary btn-sm" type="submit">Giữ lại</button></form></div></td></tr>
    <tr th:if="${#lists.isEmpty(reports)}"><td colspan="5" class="admin-empty">Không có báo cáo nào đang chờ xem xét.</td></tr>
  </tbody></table></div></section>
</main></div></div></body></html>
