<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Duyệt yêu cầu tư vấn viên')}"></head>
<body class="admin-body"><div class="admin-shell"><aside th:replace="~{admin/layout :: sidebar('advisor-applications')}"></aside><div class="admin-main"><header th:replace="~{admin/layout :: topbar}"></header>
<main class="admin-content"><div th:replace="~{admin/layout :: alerts}"></div>
  <div class="admin-page-heading"><div><div class="admin-kicker">Đội ngũ khoa</div><h1>Duyệt yêu cầu tư vấn viên</h1><p>Chỉ hiển thị yêu cầu thuộc khoa / đơn vị bạn phụ trách.</p></div></div>
  <section class="admin-card"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Người đăng ký</th><th>Khoa / chuyên đề</th><th>Chức danh</th><th>Giới thiệu</th><th>Thao tác</th></tr></thead><tbody>
    <tr th:each="advisorRequest : ${applications}"><td><strong th:text="${advisorRequest.applicant.fullName}">Tên</strong><small class="admin-secondary-text d-block" th:text="${advisorRequest.applicant.email}">email</small><small class="admin-secondary-text" th:text="${advisorRequest.applicant.phone}">Điện thoại</small></td><td><span th:text="${advisorRequest.department.name}">Khoa</span><small class="admin-secondary-text d-block" th:text="${advisorRequest.topic.name}">Chuyên đề</small></td><td><span th:text="${advisorRequest.advisorType.label}">Tư vấn viên</span><small class="admin-secondary-text d-block" th:text="${advisorRequest.audience}">Đối tượng</small></td><td class="text-wrap" th:text="${advisorRequest.motivation == null || advisorRequest.motivation.isBlank() ? '—' : advisorRequest.motivation}">Kinh nghiệm</td><td><div class="admin-inline-actions"><form th:action="@{/manager/advisor-applications/{id}/approve(id=${advisorRequest.id})}" method="post"><button class="btn btn-primary btn-sm" type="submit">Duyệt</button></form><form th:action="@{/manager/advisor-applications/{id}/reject(id=${advisorRequest.id})}" method="post" class="d-flex gap-1"><input name="reviewNote" class="form-control form-control-sm" required placeholder="Lý do từ chối"><button class="btn btn-outline-danger btn-sm" type="submit">Từ chối</button></form></div></td></tr>
    <tr th:if="${#lists.isEmpty(applications)}"><td colspan="5" class="admin-empty">Không có yêu cầu nào đang chờ duyệt.</td></tr>
  </tbody></table></div></section>
</main></div></div></body></html>
