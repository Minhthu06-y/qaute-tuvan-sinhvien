<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QAUTE - Tư vấn sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">QAUTE</a>
        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-light"
               th:href="@{/questions/public}">Diễn đàn</a>
            <a class="btn btn-light" th:href="@{/login}">Đăng nhập</a>
            <a class="btn btn-warning" th:href="@{/register}">Đăng ký</a>
        </div>
    </div>
</nav>

<section class="container py-5">
    <div class="bg-white rounded-4 shadow-sm p-5">
        <span class="badge text-bg-primary mb-3">QAUTE</span>
        <h1 class="display-5 fw-bold">
            Cổng tư vấn và hỗ trợ sinh viên
        </h1>
        <p class="lead text-secondary">
            Đặt câu hỏi, kết nối với đội ngũ tư vấn và tìm kiếm
            thông tin hỗ trợ học tập.
        </p>

        <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-primary btn-lg"
               th:href="@{/questions/public}">
                Xem diễn đàn
            </a>
            <a class="btn btn-outline-primary btn-lg"
               th:href="@{/register}">
                Đăng ký tài khoản
            </a>
        </div>
    </div>
</section>

</body>
</html>
