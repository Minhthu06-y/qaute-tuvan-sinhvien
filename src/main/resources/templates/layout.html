<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle ?: 'QAUTE - Tư vấn sinh viên'}">
        QAUTE - Tư vấn sinh viên
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            QAUTE
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/public}">
                        Diễn đàn
                    </a>
                </li>

                <li class="nav-item" th:if="${loggedIn}">
                    <a class="nav-link" th:href="@{/questions/create}">
                        Đặt câu hỏi
                    </a>
                </li>

                <li class="nav-item" th:if="${loggedIn}">
                    <a class="nav-link" th:href="@{/questions/my-questions}">
                        Câu hỏi của tôi
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <span class="text-white small" th:if="${loggedIn}"
                      th:text="${currentEmail}"></span>

                <a class="btn btn-outline-light btn-sm"
                   th:if="${!loggedIn}" th:href="@{/login}">
                    Đăng nhập
                </a>

                <a class="btn btn-light btn-sm"
                   th:if="${!loggedIn}" th:href="@{/register}">
                    Đăng ký
                </a>

                <form th:if="${loggedIn}" th:action="@{/logout}"
                      method="post" class="m-0">
                    <button class="btn btn-outline-light btn-sm"
                            type="submit">Đăng xuất</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${success}" class="alert alert-success"
         th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <div th:replace="${content}"></div>
</main>

<footer class="border-top bg-white mt-5 py-4">
    <div class="container text-center text-secondary small">
        QAUTE – Cổng tư vấn và hỗ trợ sinh viên
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
