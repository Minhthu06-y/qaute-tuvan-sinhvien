spring.application.name=qaute-tu-van-sinh-vien
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/qaute-demo;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
app.jwt.secret=${JWT_SECRET:qaute-demo-key-change-this-before-deployment-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cloudinary.url=${CLOUDINARY_URL:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
qaute.email-domain=${QAUTE_EMAIL_DOMAIN:student.hcmute.edu.vn}

