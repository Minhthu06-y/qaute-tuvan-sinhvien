spring.application.name=${APP_NAME:}
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QAUTE;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa@123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false



spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB


app.jwt.secret=${JWT_SECRET:QauteLocalDevSecretKey2026_AtLeast32Bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Cloudinary
cloudinary.url=${CLOUDINARY_URL:}

# Email Config
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
qaute.email-domain=${QAUTE_EMAIL_DOMAIN:student.hcmute.edu.vn}
