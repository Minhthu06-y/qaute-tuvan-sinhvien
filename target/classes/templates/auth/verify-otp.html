<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác minh OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width:480px">
        <div class="card-body p-4">
            <h2 class="fw-bold">Xác minh email</h2>
            <p class="text-secondary">
                Nhập mã OTP gồm 6 chữ số đã được gửi đến email của bạn.
            </p>

            <div class="alert alert-success" th:if="${success}"
                 th:text="${success}"></div>
            <div class="alert alert-danger" th:if="${error}"
                 th:text="${error}"></div>

            <form th:action="@{/verify-otp}" method="post"
                  th:object="${otpRequest}">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control"
                           th:value="${email}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mã OTP</label>
                    <input type="text" th:field="*{otp}"
                           class="form-control" inputmode="numeric"
                           maxlength="6" pattern="[0-9]{6}" required>
                    <div class="text-danger small"
                         th:errors="*{otp}"></div>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Xác minh tài khoản
                </button>
            </form>

            <form th:action="@{/resend-otp}" method="post" class="mt-3">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <input type="hidden" name="email" th:value="${email}">
                <button class="btn btn-outline-secondary w-100" type="submit">
                    Gửi lại OTP
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
