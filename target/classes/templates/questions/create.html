<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt câu hỏi QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:800px">
        <div class="card-body p-4">
            <h2 class="fw-bold">Đặt câu hỏi tư vấn</h2>
            <p class="text-secondary">
                Hãy mô tả rõ vấn đề để đội ngũ tư vấn hỗ trợ bạn.
            </p>

            <div class="alert alert-danger" th:if="${error}"
                 th:text="${error}"></div>

            <form th:action="@{/questions/create}"
                  th:object="${questionRequest}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label">Tiêu đề câu hỏi</label>
                    <input class="form-control" th:field="*{title}"
                           maxlength="200" required>
                    <div class="text-danger small"
                         th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nội dung câu hỏi</label>
                    <textarea class="form-control" th:field="*{content}"
                              rows="7" maxlength="10000" required></textarea>
                    <div class="text-danger small"
                         th:errors="*{content}"></div>
                </div>

                <button class="btn btn-primary" type="submit">
                    Gửi câu hỏi
                </button>
                <a class="btn btn-outline-secondary"
                   th:href="@{/questions/public}">Hủy</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
