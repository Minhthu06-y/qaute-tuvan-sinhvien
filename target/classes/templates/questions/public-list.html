<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diễn đàn QAUTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Diễn đàn tư vấn</h2>
            <p class="text-secondary mb-0">
                Các câu hỏi đã được công khai.
            </p>
        </div>
        <a class="btn btn-primary" th:href="@{/questions/create}">
            Đặt câu hỏi
        </a>
    </div>

    <div th:if="${#lists.isEmpty(questions)}"
         class="alert alert-info">
        Chưa có câu hỏi công khai.
    </div>

    <div th:each="q : ${questions}"
         class="card border-0 shadow-sm mb-3 question-card">
        <div class="card-body">
            <h5 class="fw-bold" th:text="${q.title}"></h5>
            <p class="text-secondary small">
                Người hỏi:
                <span th:text="${q.author.fullName}"></span>
                ·
                <span th:text="${#temporals.format(
                    q.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            </p>
            <p class="mb-0" th:text="${q.content}"></p>
        </div>
    </div>
</div>
</body>
</html>
